<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="TextilApp: registro e inventario de prendas textiles con control de stock."
    />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1020" media="(prefers-color-scheme: dark)" />
    <title>TextilApp · Inventario de prendas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello del tema claro.
      try {
        var temaGuardado = JSON.parse(localStorage.getItem('textilapp:tema'))
        var tema =
          temaGuardado === 'dark' || temaGuardado === 'light'
            ? temaGuardado
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-bs-theme', tema)
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
